<svg xmlns="http://www.w3.org/2000/svg" width="560" height="46" viewBox="0 0 560 46" fill="none">
  <defs>
    <filter id="pillGlow" x="-10%" y="-30%" width="120%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#397BFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030c1d"/>
      <stop offset="50%" stop-color="#061326"/>
      <stop offset="100%" stop-color="#07172f"/>
    </linearGradient>
  </defs>

  <!-- Pill Background -->
  <rect x="2" y="2" width="556" height="42" rx="21" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1.5" filter="url(#pillGlow)"/>

  <!-- Pill Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.5">
    <!-- React -->
    <circle cx="58" cy="23" r="5" fill="#61DAFB"/>
    <text x="70" y="27.5" fill="#61DAFB">React</text>

    <!-- Dot 1 -->
    <circle cx="145" cy="23" r="2.5" fill="#8B5CF6"/>

    <!-- Node.js -->
    <circle cx="188" cy="23" r="5" fill="#00D6A3"/>
    <text x="200" y="27.5" fill="#00D6A3">Node.js</text>

    <!-- Dot 2 -->
    <circle cx="282" cy="23" r="2.5" fill="#8B5CF6"/>

    <!-- Express -->
    <circle cx="323" cy="23" r="5" fill="#E6F0FF"/>
    <text x="335" y="27.5" fill="#E6F0FF">Express</text>

    <!-- Dot 3 -->
    <circle cx="415" cy="23" r="2.5" fill="#8B5CF6"/>

    <!-- MongoDB -->
    <circle cx="456" cy="23" r="5" fill="#00ED64"/>
    <text x="468" y="27.5" fill="#00ED64">MongoDB</text>
  </g>
</svg>
