<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      width: 260px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .thumb {
      width: 254px;
      height: 144px;
      border-radius: 12px;
      background: #030C1D;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .thumb-cyan {
      border: 1px solid rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.15), inset 0 0 15px rgba(0, 212, 255, 0.08);
      background-image: radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 60%);
    }
    .thumb-purple {
      border: 1px solid rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), inset 0 0 15px rgba(139, 92, 246, 0.08);
      background-image: radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
    }
    .thumb-green {
      border: 1px solid rgba(0, 214, 163, 0.5);
      box-shadow: 0 0 20px rgba(0, 214, 163, 0.15), inset 0 0 15px rgba(0, 214, 163, 0.08);
      background-image: radial-gradient(circle at 80% 20%, rgba(0, 214, 163, 0.15) 0%, transparent 60%);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dots {
      display: flex;
      gap: 4px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5B7294;
    }
    .badge-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 2px 7px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .tag-cyan { background: rgba(0, 212, 255, 0.12); color: #00D4FF; }
    .tag-purple { background: rgba(139, 92, 246, 0.12); color: #C084FC; }
    .tag-green { background: rgba(0, 214, 163, 0.12); color: #00D6A3; }

    .center-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
    }
    .footer-bar {
      height: 16px;
      border-radius: 4px;
      background: rgba(145, 180, 232, 0.08);
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 9.5px;
      color: #91B4E8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <!-- Container will be injected dynamically or rendered individually -->
</body>
</html>
