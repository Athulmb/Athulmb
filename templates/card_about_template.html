<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Me Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      width: 580px;
      height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      width: 574px;
      height: 324px;
      background: #061326;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(57, 123, 255, 0.06) 0%, transparent 40%),
        linear-gradient(145deg, #061326 0%, #030c1d 100%);
      border: 1.5px solid rgba(0, 212, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.12), inset 0 0 20px rgba(0, 212, 255, 0.05);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #E6F0FF;
      letter-spacing: 0.5px;
    }
    .title-accent {
      color: #00D4FF;
    }
    .description {
      font-size: 13.5px;
      line-height: 1.55;
      color: #91B4E8;
    }
    .quote-box {
      background: rgba(10, 27, 49, 0.65);
      border-left: 3px solid #8B5CF6;
      border-radius: 0 10px 10px 0;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-top: 1px solid rgba(139, 92, 246, 0.2);
      border-right: 1px solid rgba(139, 92, 246, 0.2);
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
    }
    .quote-line {
      font-size: 12.5px;
      font-weight: 500;
      color: #E6F0FF;
      font-family: 'Consolas', 'Fira Code', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quote-arrow {
      color: #8B5CF6;
      font-weight: bold;
    }
    .footer-items {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .chip-india {
      background: rgba(57, 123, 255, 0.12);
      border: 1px solid rgba(57, 123, 255, 0.4);
      color: #91B4E8;
    }
    .chip-opportunity {
      background: rgba(0, 214, 163, 0.12);
      border: 1px solid rgba(0, 214, 163, 0.45);
      color: #00D6A3;
    }
    .chip-learning {
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.45);
      color: #00D4FF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="title">About <span class="title-accent">Me</span></div>
    </div>

    <div class="description">
      I'm a passionate MERN Stack Developer who loves building dynamic and responsive full-stack web applications. I enjoy turning complex ideas into clean, user-friendly experiences.
    </div>

    <div class="quote-box">
      <div class="quote-line"><span class="quote-arrow">✦</span> Better code</div>
      <div class="quote-line"><span class="quote-arrow">✦</span> Better products</div>
      <div class="quote-line"><span class="quote-arrow">✦</span> A brighter web</div>
    </div>

    <div class="footer-items">
      <span class="chip chip-india">📍 India</span>
      <span class="chip chip-opportunity">💼 Open to Opportunities</span>
      <span class="chip chip-learning">🚀 Always Learning</span>
    </div>
  </div>
</body>
</html>
