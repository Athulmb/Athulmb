<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      width: 260px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .thumb {
      width: 254px;
      height: 144px;
      border-radius: 12px;
      background: #030C1D;
      border: 1.2px solid rgba(0, 212, 255, 0.45);
      box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.5);
      background-image: radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.45) 0%, transparent 65%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dots { display: flex; gap: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #405777; }
    .tag {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 2px 7px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #00D4FF;
      border: 1px solid rgba(0, 212, 255, 0.45);
      text-transform: uppercase;
    }
    .center-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .proj-name {
      color: #E6F0FF;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .footer-bar {
      height: 18px;
      border-radius: 4px;
      background: rgba(10, 27, 49, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 9px;
      color: #91B4E8;
      font-family: monospace;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #00D4FF; box-shadow: 0 0 6px #00D4FF;
    }
  </style>
</head>
<body>
  <div class="thumb">
    <div class="header">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <span class="tag">Full-Stack UI</span>
    </div>
    <div class="center-visual">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
      <div class="proj-name">Bricore Platform</div>
    </div>
    <div class="footer-bar">
      <span>GET /api/v1/workspace 200</span>
      <span class="status-dot"></span>
    </div>
  </div>
</body>
</html>
